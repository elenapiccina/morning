<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Good Morning Widget 🌸</title>
    <style>
        :root {
            --lavender-bg: #F3EBF7; 
            --text-dark: #4A454D;
            --heart-badge-bg: #E7DBEE;
        }

        body {
            font-family: Georgia, Cambria, "Times New Roman", Times, serif;
            background-color: transparent;
            margin: 0;
            padding: 4px;
            display: flex;
            justify-content: center;
        }

        /* Highly compact container with shrunk padding scales */
        .widget-container {
            width: 100%;
            max-width: 440px;
            background-color: var(--lavender-bg);
            border-radius: 12px;
            padding: 12px 16px;
            box-sizing: border-box;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        /* Adjusted background badge frame size */
        .heart-badge {
            width: 28px;
            height: 28px;
            background-color: var(--heart-badge-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: var(--text-dark);
        }

        .decor-icon {
            opacity: 0.25;
            font-size: 0.85rem;
            color: var(--text-dark);
            user-select: none;
        }

        /* Streamlined horizontal monospace string block container */
        .greeting-text-block {
            font-family: Menlo, Monaco, Consolas, "Courier New", monospace; 
            font-size: 0.9rem;
            color: var(--text-dark);
            background-color: rgba(255, 255, 255, 0.4);
            padding: 5px 10px;
            border-radius: 6px;
            align-self: flex-start;
            white-space: nowrap;
            letter-spacing: -0.2px;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

<div class="widget-container">
    <div class="top-row">
        <!-- Swapped out old dark indicator for requested white accent element -->
        <div class="heart-badge">🤍</div>
        <div class="decor-icon">🎛️</div>
    </div>

    <div class="greeting-text-block" id="dynamicGreetingTarget">
        Good morning, Elie 🌷 🪬
    </div>
</div>

<script>
    function calculateTimeGreeting() {
        const currentHour = new Date().getHours();
        const greetingBox = document.getElementById('dynamicGreetingTarget');
        
        if (!greetingBox) return;

        if (currentHour >= 5 && currentHour < 12) {
            greetingBox.innerHTML = "Good morning, Elie 🌷 🪬";
        } else if (currentHour >= 12 && currentHour < 18) {
            greetingBox.innerHTML = "Good afternoon, Elie ☀️ 🪬";
        } else {
            greetingBox.innerHTML = "Good evening, Elie 🌙 🪬";
        }
    }

    calculateTimeGreeting();
</script>

</body>
</html>
